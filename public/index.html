<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,noarchive">
<title>King Social</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#08111f;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
  .wrap{max-width:320px;padding:40px 20px}
  .ring{width:48px;height:48px;border:3px solid rgba(255,255,255,.08);border-top-color:#5ba4ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{color:#2e4460;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ring"></div>
  <p>Initializing...</p>
</div>
</body>
</html>
